services:
  suisse-speech-adapter:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
